# ============================================================
#  校园网自动登录 - 配置模板
#  复制本文件为 config.ini 后填写，或直接使用图形界面保存。
#
#  注意：config.ini 已被 .gitignore 排除，不会被提交到仓库。
# ============================================================

[account]
# 校园网账号（统一身份认证的用户名，一般就是学号 / 工号）
username =

# 校园网密码（明文保存在本机，请勿把此文件发给别人）
password =

# 运营商后缀：
#   校园网   -> 留空
#   中国联通 -> @cucc
#   中国电信 -> @ctc
#   中国移动 -> @zgyd
# 对应登录页上“请选择运营商”的下拉框。
# 账号里如果已经带了 @xxx，脚本不会再重复追加。
suffix =

# 账号前缀：登录页在 PC 端会自动给账号加 ",0,"，一般不用改
prefix = ,0,

# 本机 MAC 地址，留空 = 自动探测（推荐）
mac =

[portal]
# 校园网认证门户
host = 10.9.1.3
port = 801
login_path = /eportal/?c=Portal&a=login
login_method = 1
js_version = 3.3.3
timeout = 8

[check]
# 每轮检测的间隔（秒），默认 300 = 5 分钟
interval = 300

# 判定掉线前重复检测的轮数；只有连续全部失败才算断网，避免误判
probe_rounds = 2
probe_gap = 3

# 单个探测请求的超时（秒）
timeout = 5

# 公网探测地址，格式：URL|期望状态码|期望包含的文本
# 只要有一个地址通过就认为公网正常；全部失败才判定为掉线
probes =
    http://connect.rom.miui.com/generate_204|204|
    http://www.msftconnecttest.com/connecttest.txt|200|Microsoft Connect Test
    http://www.baidu.com|200|

[daemon]
# 登录失败后的首次重试间隔（秒），之后按 2 倍递增
retry_delay = 30
max_retry_delay = 600

# 日志文件（相对本脚本所在目录）
log_file = logs/auto_login.log
log_max_bytes = 1048576
log_backup_count = 3
